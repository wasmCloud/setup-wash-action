name: "setup-wash-action"
description: "GitHub Action to install the wash CLI for wasmCloud development."
author: "wasmCloud"

branding:
  icon: "cloud-drizzle"
  color: "green"

# Define your inputs here.
inputs:
  wash-version:
    description: "The version of wash to install (default: latest). Examples: latest, v2.1.0, v2.0.7"
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Install wasm32-wasip2 target for Rust
      shell: bash
      run: |
        rustup target add wasm32-wasip2

    - name: Resolve wash version
      id: resolve
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        WASH_VERSION: ${{ inputs.wash-version }}
      run: |
        set -euo pipefail
        if [ "${WASH_VERSION}" = "latest" ] || [ -z "${WASH_VERSION}" ]; then
          resolved=$(gh release view --repo wasmCloud/wasmCloud --json tagName -q .tagName)
          echo "Resolved 'latest' to ${resolved}"
        else
          resolved="${WASH_VERSION}"
          echo "Using pinned wash version ${resolved}"
        fi
        echo "version=${resolved}" >> "$GITHUB_OUTPUT"

    - name: Cache wash CLI
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # 5.0.2
      id: wash-cache
      with:
        path: |
          ${{ runner.tool_cache }}/wash/${{ steps.resolve.outputs.version }}
        key: wash-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.version }}

    - name: Install wash CLI (Unix)
      shell: bash
      if: steps.wash-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        WASH_VERSION: ${{ steps.resolve.outputs.version }}
        INSTALL_DIR: ${{ runner.tool_cache }}/wash/${{ steps.resolve.outputs.version }}
      run: |
        set -euo pipefail
        echo "Installing wash ${WASH_VERSION}"
        curl -sSL https://wasmcloud.com/sh | bash -s -- -v
        echo "wash installed and cached successfully"

    - name: Install wash CLI (Windows)
      shell: pwsh
      if: steps.wash-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        WASH_VERSION: ${{ steps.resolve.outputs.version }}
        INSTALL_DIR: ${{ runner.tool_cache }}/wash/${{ steps.resolve.outputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        Write-Host "Installing wash $env:WASH_VERSION"
        $installScript = Invoke-WebRequest -Uri "https://wasmcloud.com/ps1" -UseBasicParsing
        Invoke-Expression "& { $($installScript.Content) } -Verify"
        Write-Host "wash installed and cached successfully"

    - name: Add wash to PATH
      shell: bash
      if: runner.os != 'Windows'
      run: |
        wash_version="${{ steps.resolve.outputs.version }}"
        wash_cache_dir="${RUNNER_TOOL_CACHE}/wash/${wash_version}"
        echo "${wash_cache_dir}" >> $GITHUB_PATH

    - name: Add wash to PATH (Windows)
      shell: pwsh
      if: runner.os == 'Windows'
      run: |
        $wash_version = "${{ steps.resolve.outputs.version }}"
        $wash_cache_dir = "$env:RUNNER_TOOL_CACHE\wash\$wash_version"
        Add-Content -Path $env:GITHUB_PATH -Value $wash_cache_dir
